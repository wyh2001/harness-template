_min_copier_version: "9.0.0"
_templates_suffix: ".jinja"
_answers_file: ".copier-answers.yml"
_exclude:
  - ".git"
  - ".DS_Store"
  - "copier.yml"
  - "TEMPLATE.md"
  - ".agents"
  - "node_modules"
  - "target"
  - "{% if swift_app_stack != 'ios' or not include_swift_format %}.swift-format{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' or not include_swiftlint %}.swiftlint.yml{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' %}docs/decisions/0003-use-xcodegen-as-project-source.md{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' %}docs/decisions/0004-use-one-fixed-local-simulator.md{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' %}docs/tasks/ios-testing.md{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' %}scripts/build-for-testing.mjs{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' %}scripts/simulator.mjs{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' %}scripts/test.mjs{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' or not include_swiftlint %}scripts/lint-swiftlint.sh{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' or not include_xctest_impact_selection %}scripts/xctest-impact-rules.mjs{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' or not include_xctest_impact_selection %}scripts/select-xctest-impact-tests.mjs{% else %}__copier_never__{% endif %}"
  - "{% if swift_app_stack != 'ios' or not include_xctest_impact_selection %}scripts/validate-xctest-impact-rules.mjs{% else %}__copier_never__{% endif %}"

project_name:
  type: str
  help: Human-readable project name.
  default: "My Project"

project_slug:
  type: str
  help: Machine-readable project slug used in package names, temp dirs, and default health text.
  default: "{{ project_name | lower | replace(' ', '-') }}"

project_summary:
  type: str
  help: One-sentence project summary for README and docs.
  default: "{{ project_name }} project workspace."

main_spec_title:
  type: str
  help: Title of the primary product spec.
  default: "{{ project_name }} Spec v0.1"

main_spec_slug:
  type: str
  help: File slug for the primary product spec under docs/specs.
  default: "{{ project_slug }}-spec"

backend_stack:
  type: str
  help: Backend gate family to wire into scripts and docs.
  choices:
    Rust workspace: rust
    .NET API: dotnet
    No backend yet: none
  default: rust

frontend_stack:
  type: str
  help: Frontend gate family to wire into scripts and docs.
  choices:
    Vite app with pnpm: vite
    Astro app with pnpm: astro
    No frontend yet: none
  default: vite

swift_app_stack:
  type: str
  help: Apple-platform Swift app harness to add alongside any backend or web frontend.
  choices:
    iOS app generated with XcodeGen: ios
    No Swift app: none
  default: none

swift_project_name:
  type: str
  help: Internal Xcode project, scheme, and product name; keep localized display names separate.
  when: "{{ swift_app_stack == 'ios' }}"
  default: "{{ project_name | replace(' ', '') }}"

swift_project_spec_path:
  type: str
  help: XcodeGen specification path relative to the repository root.
  when: "{{ swift_app_stack == 'ios' }}"
  default: project.yml

swift_source_dir:
  type: str
  help: Root directory containing hand-written Swift product sources.
  when: "{{ swift_app_stack == 'ios' }}"
  default: Sources

swift_unit_test_target:
  type: str
  help: XCTest unit-test target and default source-directory name.
  when: "{{ swift_app_stack == 'ios' }}"
  default: "{{ swift_project_name }}Tests"

swift_ui_test_target:
  type: str
  help: XCTest UI-test target and default source-directory name.
  when: "{{ swift_app_stack == 'ios' }}"
  default: "{{ swift_project_name }}UITests"

swift_smoke_test_identifier:
  type: str
  help: Stable XCTest target/class identifier used by scripts/smoke.sh after that test exists.
  when: "{{ swift_app_stack == 'ios' }}"
  default: "{{ swift_unit_test_target }}/StartupSmokeTests"

swift_test_destination_env:
  type: str
  help: Environment variable through which CI supplies its explicit xcodebuild destination.
  when: "{{ swift_app_stack == 'ios' }}"
  default: "{{ project_slug | upper | replace('-', '_') }}_TEST_DESTINATION"

swift_simulator_name:
  type: str
  help: Stable local simulator name. The simulator UUID is discovered locally and never committed.
  when: "{{ swift_app_stack == 'ios' }}"
  default: "{{ swift_project_name }}-iPhone"

swift_simulator_device_name:
  type: str
  help: Pinned local simulator device type name installed with the selected Xcode.
  when: "{{ swift_app_stack == 'ios' }}"
  default: iPhone 17

swift_simulator_device_identifier:
  type: str
  help: CoreSimulator device type identifier matching the pinned device name.
  when: "{{ swift_app_stack == 'ios' }}"
  default: com.apple.CoreSimulator.SimDeviceType.iPhone-17

swift_simulator_runtime_name:
  type: str
  help: Pinned local simulator runtime name installed with the selected Xcode.
  when: "{{ swift_app_stack == 'ios' }}"
  default: iOS 26.1

swift_simulator_runtime_identifier:
  type: str
  help: CoreSimulator runtime identifier matching the pinned runtime name.
  when: "{{ swift_app_stack == 'ios' }}"
  default: com.apple.CoreSimulator.SimRuntime.iOS-26-1

swift_ci_destination:
  type: str
  help: Explicit simulator destination available on the GitHub macOS runner.
  when: "{{ swift_app_stack == 'ios' }}"
  default: "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest"

include_swift_format:
  type: bool
  help: Use swift-format as the Swift formatting owner (recommended). Disable it only when another formatter or a deliberately formatting-enabled SwiftLint configuration owns formatting.
  when: "{{ swift_app_stack == 'ios' }}"
  default: true

include_swiftlint:
  type: bool
  help: Optionally add SwiftLint. Its formatting-style rules can overlap or conflict with swift-format, so the generated config enables only a small semantic rule set; reconsider include_swift_format before expanding SwiftLint into formatting.
  when: "{{ swift_app_stack == 'ios' }}"
  default: false

include_xctest_impact_selection:
  type: bool
  help: Require project-owned impact areas that map changed Swift boundaries to focused XCTest classes.
  when: "{{ swift_app_stack == 'ios' }}"
  default: true

frontend_dir:
  type: str
  help: Frontend directory relative to repo root.
  when: "{{ frontend_stack != 'none' }}"
  default: "{% if frontend_stack == 'vite' %}apps/web{% else %}frontend{% endif %}"

pnpm_version:
  type: str
  help: pnpm version used by generated frontend and CI commands.
  default: "10.33.0"

node_version:
  type: str
  help: Node.js major version for CI.
  default: "24"

rust_api_package:
  type: str
  help: Cargo package that runs the HTTP API.
  when: "{{ backend_stack == 'rust' }}"
  default: "{{ project_slug }}-api"

rust_openapi_bin:
  type: str
  help: Cargo binary that writes OpenAPI JSON to the path passed as its first argument.
  when: "{{ backend_stack == 'rust' }}"
  default: "generate-openapi"

dotnet_solution_path:
  type: str
  help: .NET solution path used by build, test, and format gates.
  when: "{{ backend_stack == 'dotnet' }}"
  default: "backend/{{ project_name | replace(' ', '') }}.slnx"

dotnet_api_project_path:
  type: str
  help: .NET API csproj path.
  when: "{{ backend_stack == 'dotnet' }}"
  default: "backend/{{ project_name | replace(' ', '') }}.Api/{{ project_name | replace(' ', '') }}.Api.csproj"

dotnet_openapi_build_output:
  type: str
  help: OpenAPI JSON path produced by the .NET build.
  when: "{{ backend_stack == 'dotnet' }}"
  default: "backend/{{ project_name | replace(' ', '') }}.Api/obj/{{ project_slug }}-api.json"

dotnet_openapi_contract_path:
  type: str
  help: Committed backend OpenAPI contract path.
  when: "{{ backend_stack == 'dotnet' }}"
  default: "backend/{{ project_name | replace(' ', '') }}.Api/openapi/{{ project_slug }}-api.json"

api_host:
  type: str
  help: Default API host for dev and smoke scripts.
  when: "{{ backend_stack != 'none' }}"
  default: "127.0.0.1"

api_port:
  type: int
  help: Default API port for dev and smoke scripts.
  when: "{{ backend_stack != 'none' }}"
  default: "{% if backend_stack == 'dotnet' %}5180{% else %}3001{% endif %}"

api_health_path:
  type: str
  help: API path checked by health and smoke scripts.
  when: "{{ backend_stack != 'none' }}"
  default: "/api/health"

api_health_text:
  type: str
  help: Text expected in the API health response.
  when: "{{ backend_stack != 'none' }}"
  default: "{{ project_slug }}-api"

frontend_host:
  type: str
  help: Default frontend host for dev and smoke scripts.
  when: "{{ frontend_stack != 'none' }}"
  default: "127.0.0.1"

frontend_port:
  type: int
  help: Default frontend port for dev and smoke scripts.
  when: "{{ frontend_stack != 'none' }}"
  default: "{% if frontend_stack == 'astro' %}4321{% else %}5173{% endif %}"

frontend_health_text:
  type: str
  help: Text expected in the frontend home page during health and smoke checks.
  when: "{{ frontend_stack != 'none' }}"
  default: "{{ project_name }}"

include_api_contract:
  type: bool
  help: Generate OpenAPI freshness scripts and wire them into finalize so backend/frontend DTOs have one source of truth.
  default: "{{ backend_stack != 'none' and frontend_stack != 'none' }}"

openapi_contract_path:
  type: str
  help: Committed OpenAPI contract path for Rust projects.
  when: "{{ backend_stack == 'rust' and include_api_contract }}"
  default: "generated/openapi.json"

frontend_schema_path:
  type: str
  help: Generated frontend API TypeScript schema path.
  when: "{{ frontend_stack != 'none' and include_api_contract }}"
  default: "{% if frontend_stack == 'vite' %}{{ frontend_dir }}/src/shared/api/schema.d.ts{% else %}{{ frontend_dir }}/src/shared/api/generated/schema.d.ts{% endif %}"

include_layering_validator:
  type: bool
  help: Add scripts/validate-layering.mjs and wire it into finalize.
  default: true

include_playwright_e2e:
  type: bool
  help: Wire a Playwright E2E gate into docs, finalize, and CI after the frontend scaffold exists.
  when: "{{ frontend_stack != 'none' }}"
  default: false

playwright_config_path:
  type: str
  help: Playwright config path used by the E2E task and validation docs.
  when: "{{ frontend_stack != 'none' and include_playwright_e2e }}"
  default: "{{ frontend_dir }}/playwright.config.ts"

e2e_test_dir:
  type: str
  help: E2E test directory used by the Playwright task docs.
  when: "{{ frontend_stack != 'none' and include_playwright_e2e }}"
  default: "{{ frontend_dir }}/e2e"
